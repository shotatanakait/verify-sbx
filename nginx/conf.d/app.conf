lua_shared_dict cache      10m;
lua_shared_dict rate_limit  1m;

server {
    listen      8080;
    server_name localhost;

    access_by_lua_block {
        require("middleware.auth").check()
        require("middleware.rate_limit").check()
    }

    header_filter_by_lua_block {
        local elapsed = ngx.now() - ngx.req.start_time()
        ngx.header["X-Render-Time"] = string.format("%.2fms", elapsed * 1000)
    }

    location / {
        content_by_lua_block {
            require("router").dispatch()
        }
    }
}
